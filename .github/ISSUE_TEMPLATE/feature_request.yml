name: Feature request
description: Suggest an idea or improvement for Verso
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the task or problem — what are you trying to achieve while writing?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could Verso help?
      description: The behaviour you have in mind. How do other editors handle it, if relevant?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
