name: Bug report
description: Something in Verso does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project with …
        2. Press Cmd/Ctrl + Enter
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Verso version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: tex
    attributes:
      label: TeX distribution and version
      description: Output of `latexmk -v` and the distribution (MacTeX, TeX Live, MiKTeX)
  - type: textarea
    id: sample
    attributes:
      label: Minimal example or log
      description: For compile problems, a small `.tex` file that shows the issue and/or the relevant part of the log (Problems panel → View raw log).
      render: latex
